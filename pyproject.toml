[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "diyanet-mcp"
version = "0.1.0"
description = "Unofficial read-only MCP server for Diyanet prayer times (Turkey) — official timetable for 81 provinces and districts, monthly tables, qibla"
readme = "README.md"
license = { text = "PolyForm-Noncommercial-1.0.0" }
requires-python = ">=3.10"
dependencies = [
    "mcp<2",
    "curl-cffi>=0.7,<1.0",
    "requests>=2.32",
]
authors = [{ name = "Mohammad Abbasi" }]

[project.scripts]
diyanet-mcp = "diyanet_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/diyanet_mcp"]
